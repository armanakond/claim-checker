[project]
name = "claimchecker"
version = "0.1.0"
description = "Automated news claim extraction and verification pipeline"
authors = [
    {name = "armanakond",email = "arman.akond01@gmail.com"}
]
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
    "trafilatura (>=2.2.0,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "spacy (>=3.8.16,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "transformers (>=5.17.0,<6.0.0)",
    "torch (>=2.14.0,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "streamlit (>=1.64.0,<2.0.0)",
    "slowapi (>=0.1.10,<0.2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)"
]
